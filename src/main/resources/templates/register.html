<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create account')}"></head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header th:replace="~{fragments :: header}"></header>
<main id="main" class="page-shell narrow">
    <div class="page-heading">
        <div class="page-heading-copy">
            <h1>Create your student account.</h1>
            <p>Your email becomes your sign-in. A profile image is optional.</p>
        </div>
    </div>
    <section class="panel form-shell">
        <div class="panel-body">
            <div id="profile-image-error" th:if="${fileError}" class="alert alert-error" role="alert" th:text="${fileError}">Invalid image.</div>
            <form class="form-grid" th:action="@{/register}" th:object="${user}" method="post" enctype="multipart/form-data">
                <div class="field field-full">
                    <label for="fullName">Full name</label>
                    <input id="fullName" type="text" th:field="*{fullName}" autocomplete="name" maxlength="100" required
                           th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid' : ''"
                           th:attr="aria-invalid=${#fields.hasErrors('fullName')},aria-describedby=${#fields.hasErrors('fullName') ? 'fullName-error' : null}">
                    <span id="fullName-error" class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                </div>
                <div class="field field-full">
                    <label for="username">Email</label>
                    <input id="username" type="email" th:field="*{username}" autocomplete="email" maxlength="254" required
                           th:classappend="${#fields.hasErrors('username')} ? ' is-invalid' : ''"
                           th:attr="aria-invalid=${#fields.hasErrors('username')},aria-describedby=${#fields.hasErrors('username') ? 'username-error' : null}">
                    <span id="username-error" class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                </div>
                <div class="field">
                    <label for="mobileNumber">Phone <span class="muted small">(optional)</span></label>
                    <input id="mobileNumber" type="tel" th:field="*{mobileNumber}" autocomplete="tel" maxlength="30"
                           th:classappend="${#fields.hasErrors('mobileNumber')} ? ' is-invalid' : ''"
                           th:attr="aria-invalid=${#fields.hasErrors('mobileNumber')},aria-describedby=${#fields.hasErrors('mobileNumber') ? 'mobileNumber-error' : null}">
                    <span id="mobileNumber-error" class="field-error" th:if="${#fields.hasErrors('mobileNumber')}" th:errors="*{mobileNumber}"></span>
                </div>
                <div class="field">
                    <label for="profilePicFile">Profile image <span class="muted small">(optional)</span></label>
                    <input id="profilePicFile" type="file" name="profilePicFile" accept="image/png,image/jpeg"
                           th:attr="aria-invalid=${fileError != null},aria-describedby=${fileError != null ? 'profile-image-help profile-image-error' : 'profile-image-help'}">
                    <span id="profile-image-help" class="field-help">JPEG or PNG, up to 5 MB.</span>
                </div>
                <div class="field field-full">
                    <label for="password">Password</label>
                    <input id="password" type="password" th:field="*{password}" autocomplete="new-password" minlength="12" maxlength="100" required
                           th:classappend="${#fields.hasErrors('password')} ? ' is-invalid' : ''"
                           th:attr="aria-invalid=${#fields.hasErrors('password')},aria-describedby=${#fields.hasErrors('password') ? 'password-help password-error' : 'password-help'}">
                    <span id="password-help" class="field-help">Use at least 12 characters.</span>
                    <span id="password-error" class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>
                <div class="form-actions field-full">
                    <button class="button" type="submit">Create account</button>
                    <a class="button button-secondary" th:href="@{/login}">Back to sign in</a>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header th:replace="~{fragments :: header}"></header>
<main id="main" class="auth-page">
    <div class="auth-shell">
        <div class="auth-heading">
            <h1>Welcome back.</h1>
            <p class="muted">Sign in to continue to your ExamFlow workspace.</p>
        </div>
        <section class="auth-panel">
            <div class="message-stack" aria-live="polite">
                <div th:if="${param.error}" class="alert alert-error" role="alert">The email or password is incorrect.</div>
                <div th:if="${param.logout}" class="alert alert-success">You have signed out.</div>
                <div th:if="${param.registered}" class="alert alert-success">Account created. You can sign in now.</div>
            </div>
            <form class="stack" th:action="@{/login}" method="post">
                <div class="field">
                    <label for="username">Email</label>
                    <input id="username" name="username" type="email" autocomplete="username" required autofocus>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="button button-wide" type="submit">Sign in</button>
            </form>
        </section>
        <p class="auth-footer">New to ExamFlow? <a th:href="@{/register}">Create a student account</a>.</p>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Add question')}"></head>
<body><a class="skip-link" href="#main">Skip to content</a><header th:replace="~{fragments :: header}"></header>
<main id="main" class="page-shell narrow">
    <div class="page-heading"><div class="page-heading-copy"><h1>Add a question.</h1><p th:text="|Build the question set for ${exam.title}.|">Build the question set.</p></div><a class="button button-secondary" th:href="@{/admin/exam/manage-questions/{id}(id=${exam.id})}">View questions</a></div>
    <div th:replace="~{fragments :: messages}"></div>
    <section class="panel"><div class="panel-body">
        <form class="form-grid" th:action="@{/admin/exam/question/add}" th:object="${question}" method="post">
            <input type="hidden" name="examId" th:value="${exam.id}">
            <div class="field field-full"><label for="text">Question</label><textarea id="text" th:field="*{text}" maxlength="1024" required th:classappend="${#fields.hasErrors('text')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('text')},aria-describedby=${#fields.hasErrors('text') ? 'text-error' : null}"></textarea><span id="text-error" class="field-error" th:if="${#fields.hasErrors('text')}" th:errors="*{text}"></span></div>
            <div class="field"><label for="option1">Option 1</label><input id="option1" th:field="*{option1}" maxlength="500" required th:classappend="${#fields.hasErrors('option1')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('option1')},aria-describedby=${#fields.hasErrors('option1') ? 'option1-error' : null}"><span id="option1-error" class="field-error" th:if="${#fields.hasErrors('option1')}" th:errors="*{option1}"></span></div>
            <div class="field"><label for="option2">Option 2</label><input id="option2" th:field="*{option2}" maxlength="500" required th:classappend="${#fields.hasErrors('option2')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('option2')},aria-describedby=${#fields.hasErrors('option2') ? 'option2-error' : null}"><span id="option2-error" class="field-error" th:if="${#fields.hasErrors('option2')}" th:errors="*{option2}"></span></div>
            <div class="field"><label for="option3">Option 3</label><input id="option3" th:field="*{option3}" maxlength="500" required th:classappend="${#fields.hasErrors('option3')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('option3')},aria-describedby=${#fields.hasErrors('option3') ? 'option3-error' : null}"><span id="option3-error" class="field-error" th:if="${#fields.hasErrors('option3')}" th:errors="*{option3}"></span></div>
            <div class="field"><label for="option4">Option 4</label><input id="option4" th:field="*{option4}" maxlength="500" required th:classappend="${#fields.hasErrors('option4')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('option4')},aria-describedby=${#fields.hasErrors('option4') ? 'option4-error' : null}"><span id="option4-error" class="field-error" th:if="${#fields.hasErrors('option4')}" th:errors="*{option4}"></span></div>
            <div class="field"><label for="correctAnswer">Correct option</label><select id="correctAnswer" th:field="*{correctAnswer}" required th:classappend="${#fields.hasErrors('correctAnswer')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('correctAnswer')},aria-describedby=${#fields.hasErrors('correctAnswer') ? 'correctAnswer-error' : null}"><option value="0" disabled>Select an option</option><option value="1">Option 1</option><option value="2">Option 2</option><option value="3">Option 3</option><option value="4">Option 4</option></select><span id="correctAnswer-error" class="field-error" th:if="${#fields.hasErrors('correctAnswer')}" th:errors="*{correctAnswer}"></span></div>
            <div class="field"><label for="marks">Marks</label><input id="marks" type="number" th:field="*{marks}" min="1" max="100" required th:classappend="${#fields.hasErrors('marks')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('marks')},aria-describedby=${#fields.hasErrors('marks') ? 'marks-error' : null}"><span id="marks-error" class="field-error" th:if="${#fields.hasErrors('marks')}" th:errors="*{marks}"></span></div>
            <div class="form-actions field-full"><button class="button" type="submit">Save question</button><a class="button button-secondary" th:href="@{/admin/manage-exams}">Finish</a></div>
        </form>
    </div></section>
</main></body></html>

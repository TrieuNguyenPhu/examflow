<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Add question')}"></head>
<body><a class="skip-link" href="#main">Skip to content</a><header th:replace="~{fragments :: header}"></header>
<main id="main" class="page-shell narrow">
    <div class="page-heading"><div class="page-heading-copy"><h1>Add a question.</h1><p th:text="|Build the question set for ${exam.title}.|">Build the question set.</p></div><a class="button button-secondary" th:href="@{/admin/exam/manage-questions/{id}(id=${exam.id})}">View questions</a></div>
    <div th:replace="~{fragments :: messages}"></div>
    <section class="panel"><div class="panel-body">
        <form class="form-grid" th:action="@{/admin/exam/question/add}" th:object="${question}" method="post">
            <input type="hidden" name="examId" th:value="${exam.id}">
            <div class="field field-full"><label for="text">Question</label><textarea id="text" th:field="*{text}" maxlength="1024" required></textarea><span class="field-error" th:errors="*{text}"></span></div>
            <div class="field"><label for="option1">Option 1</label><input id="option1" th:field="*{option1}" maxlength="500" required><span class="field-error" th:errors="*{option1}"></span></div>
            <div class="field"><label for="option2">Option 2</label><input id="option2" th:field="*{option2}" maxlength="500" required><span class="field-error" th:errors="*{option2}"></span></div>
            <div class="field"><label for="option3">Option 3</label><input id="option3" th:field="*{option3}" maxlength="500" required><span class="field-error" th:errors="*{option3}"></span></div>
            <div class="field"><label for="option4">Option 4</label><input id="option4" th:field="*{option4}" maxlength="500" required><span class="field-error" th:errors="*{option4}"></span></div>
            <div class="field"><label for="correctAnswer">Correct option</label><select id="correctAnswer" th:field="*{correctAnswer}" required><option value="0" disabled>Select an option</option><option value="1">Option 1</option><option value="2">Option 2</option><option value="3">Option 3</option><option value="4">Option 4</option></select><span class="field-error" th:errors="*{correctAnswer}"></span></div>
            <div class="field"><label for="marks">Marks</label><input id="marks" type="number" th:field="*{marks}" min="1" max="100" required><span class="field-error" th:errors="*{marks}"></span></div>
            <div class="form-actions field-full"><button class="button" type="submit">Save question</button><a class="button button-secondary" th:href="@{/admin/manage-exams}">Finish</a></div>
        </form>
    </div></section>
</main></body></html>

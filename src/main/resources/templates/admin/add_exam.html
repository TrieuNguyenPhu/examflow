<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create exam')}"></head>
<body><a class="skip-link" href="#main">Skip to content</a><header th:replace="~{fragments :: header}"></header>
<main id="main" class="page-shell narrow">
    <div class="page-heading"><div class="page-heading-copy"><h1>Create an exam.</h1><p>Set the context and time limit. Questions come next.</p></div></div>
    <section class="panel"><div class="panel-body">
        <form class="form-grid" th:action="@{/admin/exam/add}" th:object="${exam}" method="post">
            <div class="field field-full"><label for="title">Exam title</label><input id="title" th:field="*{title}" maxlength="120" required th:classappend="${#fields.hasErrors('title')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('title')},aria-describedby=${#fields.hasErrors('title') ? 'title-error' : null}"><span id="title-error" class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span></div>
            <div class="field field-full"><label for="description">Description <span class="muted small">(optional)</span></label><textarea id="description" th:field="*{description}" maxlength="1000" th:classappend="${#fields.hasErrors('description')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('description')},aria-describedby=${#fields.hasErrors('description') ? 'description-error' : null}"></textarea><span id="description-error" class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span></div>
            <div class="field"><label for="durationInMinutes">Duration in minutes</label><input id="durationInMinutes" type="number" th:field="*{durationInMinutes}" min="1" max="480" required th:classappend="${#fields.hasErrors('durationInMinutes')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('durationInMinutes')},aria-describedby=${#fields.hasErrors('durationInMinutes') ? 'duration-error' : null}"><span id="duration-error" class="field-error" th:if="${#fields.hasErrors('durationInMinutes')}" th:errors="*{durationInMinutes}"></span></div>
            <div class="form-actions field-full"><button class="button" type="submit">Create exam</button><a class="button button-secondary" th:href="@{/admin/manage-exams}">Cancel</a></div>
        </form>
    </div></section>
</main></body></html>

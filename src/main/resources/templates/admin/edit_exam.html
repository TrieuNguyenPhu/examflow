<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Edit exam')}"></head>
<body><a class="skip-link" href="#main">Skip to content</a><header th:replace="~{fragments :: header}"></header>
<main id="main" class="page-shell narrow">
    <div class="page-heading"><div class="page-heading-copy"><h1>Edit exam.</h1><p>Changes apply to future attempts. Existing submissions remain unchanged.</p></div></div>
    <section class="panel"><div class="panel-body">
        <form class="form-grid" th:action="@{/admin/exam/update/{id}(id=${exam.id})}" th:object="${exam}" method="post">
            <div class="field field-full"><label for="title">Exam title</label><input id="title" th:field="*{title}" maxlength="120" required><span class="field-error" th:errors="*{title}"></span></div>
            <div class="field field-full"><label for="description">Description <span class="muted small">(optional)</span></label><textarea id="description" th:field="*{description}" maxlength="1000"></textarea><span class="field-error" th:errors="*{description}"></span></div>
            <div class="field"><label for="durationInMinutes">Duration in minutes</label><input id="durationInMinutes" type="number" th:field="*{durationInMinutes}" min="1" max="480" required><span class="field-error" th:errors="*{durationInMinutes}"></span></div>
            <div class="form-actions field-full"><button class="button" type="submit">Save changes</button><a class="button button-secondary" th:href="@{/admin/manage-exams}">Cancel</a></div>
        </form>
    </div></section>
</main></body></html>

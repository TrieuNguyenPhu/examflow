<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title th:text="${title + ' · ExamFlow'}">ExamFlow</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header class="site-header" th:fragment="header">
    <div class="nav-shell">
        <a class="brand" th:href="@{/}" aria-label="ExamFlow home">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M5 7h7l3 3h4M5 12h5l3 3h6M5 17h7"/>
                </svg>
            </span>
            <span>ExamFlow</span>
        </a>
        <button class="nav-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="primary-nav">Menu</button>
        <nav class="primary-nav" id="primary-nav" aria-label="Primary navigation">
            <th:block sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/dashboard}"
                   th:classappend="${currentPath == '/admin/dashboard'} ? 'nav-current' : ''"
                   th:attr="aria-current=${currentPath == '/admin/dashboard' ? 'page' : null}">Overview</a>
                <a th:href="@{/admin/manage-exams}"
                   th:classappend="${#strings.startsWith(currentPath, '/admin/manage-exams') or #strings.startsWith(currentPath, '/admin/exam') or #strings.startsWith(currentPath, '/admin/question') or #strings.startsWith(currentPath, '/admin/results')} ? 'nav-current' : ''"
                   th:attr="aria-current=${#strings.startsWith(currentPath, '/admin/manage-exams') or #strings.startsWith(currentPath, '/admin/exam') or #strings.startsWith(currentPath, '/admin/question') or #strings.startsWith(currentPath, '/admin/results') ? 'page' : null}">Exams</a>
                <a th:href="@{/admin/students}"
                   th:classappend="${#strings.startsWith(currentPath, '/admin/students')} ? 'nav-current' : ''"
                   th:attr="aria-current=${#strings.startsWith(currentPath, '/admin/students') ? 'page' : null}">Students</a>
            </th:block>
            <th:block sec:authorize="hasRole('STUDENT')">
                <a th:href="@{/student/dashboard}"
                   th:classappend="${currentPath == '/student/dashboard'} ? 'nav-current' : ''"
                   th:attr="aria-current=${currentPath == '/student/dashboard' ? 'page' : null}">Dashboard</a>
                <a th:href="@{/student/my-results}"
                   th:classappend="${#strings.startsWith(currentPath, '/student/my-results') or #strings.startsWith(currentPath, '/student/review') or #strings.startsWith(currentPath, '/student/result')} ? 'nav-current' : ''"
                   th:attr="aria-current=${#strings.startsWith(currentPath, '/student/my-results') or #strings.startsWith(currentPath, '/student/review') or #strings.startsWith(currentPath, '/student/result') ? 'page' : null}">Results</a>
                <a th:href="@{/student/profile}"
                   th:classappend="${#strings.startsWith(currentPath, '/student/profile')} ? 'nav-current' : ''"
                   th:attr="aria-current=${#strings.startsWith(currentPath, '/student/profile') ? 'page' : null}">Profile</a>
            </th:block>
            <th:block sec:authorize="isAnonymous()">
                <a th:href="@{/login}">Sign in</a>
                <a class="button button-small" th:href="@{/register}">Create account</a>
            </th:block>
            <details class="account-menu" sec:authorize="isAuthenticated()">
                <summary>
                    <img th:if="${currentUser != null and currentUser.profilePicUrl != null}"
                         th:src="@{${currentUser.profilePicUrl}}" alt="" class="avatar avatar-small">
                    <span th:unless="${currentUser != null and currentUser.profilePicUrl != null}" class="avatar avatar-small avatar-fallback" aria-hidden="true">EF</span>
                    <span th:text="${currentUser != null ? currentUser.fullName : 'Account'}">Account</span>
                </summary>
                <div class="account-popover">
                    <span class="account-email" th:if="${currentUser != null}" th:text="${currentUser.username}">user@example.com</span>
                    <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/profile}">Account settings</a>
                    <form th:action="@{/logout}" method="post">
                        <button class="text-button" type="submit">Sign out</button>
                    </form>
                </div>
            </details>
        </nav>
    </div>
</header>

<div th:fragment="messages" class="message-stack" aria-live="polite">
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}">Saved.</span>
        <button type="button" class="alert-close" data-dismiss-alert aria-label="Dismiss message">Close</button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-error" role="alert">
        <span th:text="${errorMessage}">Something went wrong.</span>
        <button type="button" class="alert-close" data-dismiss-alert aria-label="Dismiss message">Close</button>
    </div>
</div>

<footer class="site-footer" th:fragment="footer">
    <div class="container footer-row">
        <span>ExamFlow</span>
        <span>Secure assessment workflows, self-hosted.</span>
    </div>
</footer>
</body>
</html>

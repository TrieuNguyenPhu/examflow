spring.application.name=ExamFlow
server.port=${SERVER_PORT:7890}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/examflow;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=${UPLOAD_DIR:./uploads}

app.bootstrap-admin.username=${APP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${APP_ADMIN_NAME:Administrator}
